name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version bootstrap.py supports; 3.12 matches the runner default.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run installer, lock-format, and package integrity tests
        run: python -m unittest discover -s evaluations/bootstrap-repo -p 'test_*.py' -v

      - name: Verify retained evaluation snapshot integrity
        run: python evaluations/technical-document-review/check_results.py evaluations/technical-document-review/runs/2026-10-29
