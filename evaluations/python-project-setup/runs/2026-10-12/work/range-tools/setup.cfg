[metadata]
name = range-tools
version = 0.1.0
description = Clip ordinary integers and finite floats to an interval
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.extras_require]
dev =
    ruff
    mypy

[options.package_data]
range_tools = py.typed
